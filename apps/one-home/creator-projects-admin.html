<style>
:root{--bg:#080706;--panel:#15110e;--line:#513c2f;--cream:#fff1db;--muted:#baa999;--red:#ef1825;--pink:#ff36d6;--green:#68dc6d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0,#29170c 0,#080706 45%,#030303 100%);color:var(--cream);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}button,.button{border:1px solid #674a39;background:#1b1511;color:var(--cream);border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer;text-decoration:none}button.primary{background:var(--red);border-color:var(--red)}button:disabled{opacity:.5}.hidden{display:none!important}.top{display:flex;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid #3a2920;background:#050403;position:sticky;top:0;z-index:10}.top img{width:58px;height:50px;object-fit:contain}.top h1{font-size:18px;margin:0}.top p{font-size:11px;color:var(--muted);margin:3px 0 0}.top .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.wrap{width:min(1180px,calc(100% - 30px));margin:24px auto}.card{border:1px solid var(--line);background:linear-gradient(145deg,#171310,#0c0b0a);border-radius:17px;padding:20px}.login{width:min(520px,100%);margin:70px auto}.login label{display:block;font-weight:800;margin:14px 0 7px}.login input{width:100%;padding:12px;border:1px solid #604a3b;border-radius:10px;background:#080706;color:#fff}.notice{margin-top:14px;padding:12px;border:1px solid #8a373d;background:#321217;border-radius:10px;color:#ffd5d8}.notice.good{border-color:#317d45;background:#0e2b17;color:#d8ffe0}.head{display:flex;gap:14px;align-items:end;justify-content:space-between;margin-bottom:16px}.head h2{margin:0 0 5px}.muted{color:var(--muted)}.projects{display:grid;gap:12px}.project{border:1px solid #46352b;background:#0c0a09;border-radius:14px;padding:16px}.project-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px}.project h3{margin:0 0 6px}.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #5b4638;border-radius:999px;padding:4px 8px;font-size:11px}.pill.draft{border-color:#d99a44;color:#ffd18d}.pill.ready,.pill.published{border-color:var(--green);color:#b9ffbd}.detail{margin-top:14px;padding-top:14px;border-top:1px solid #332820}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;font-size:13px}.detail-item{border:1px solid #392d26;border-radius:10px;padding:10px}.detail-item strong{display:block;color:#e8c7ad;margin-bottom:4px}.art{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:13px}.art figure{margin:0;border:1px solid #392d26;border-radius:11px;padding:8px;background:#050404}.art img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:7px;background:#111}.art figcaption{font-size:10px;color:var(--muted);margin-top:6px;word-break:break-word}@media(max-width:700px){.top{align-items:flex-start}.top .actions{margin-left:0}.project-top,.detail-grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}

<body>
<header class="top"><img src="/assets/one-home-logo.png" alt="One Home"><div><h1>NFT Creator Draft Records</h1><p>Private saved NFT Creator drafts and artwork records</p></div><div class="actions"><a class="button" href="/admin.html">Main Admin</a><a class="button" href="/" target="_blank" rel="noopener">Open One Home</a><button id="logout" class="hidden" type="button">Log Out</button></div></header>
<main class="wrap">
  <section id="login" class="card login"><h2>Admin Sign In</h2><p class="muted">Use an approved One Home admin account.</p><label for="email">Email</label><input id="email" type="email" autocomplete="username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><button id="signIn" class="primary" type="button" style="margin-top:16px">Sign In</button><div id="loginNotice" class="notice hidden"></div></section>
  <section id="app" class="hidden"><div class="head"><div><h2>NFT Creator Draft Records</h2><div id="summary" class="muted"></div></div><button id="refresh" type="button">Refresh Projects</button></div><div id="notice" class="notice hidden"></div><div id="projects" class="projects"></div></section>
</main>
<script>
(function(){
'use strict';
const URL='https://fshvettlltcujmwvikfq.supabase.co',KEY='sb_publishable_ARrX-vYhy8l-yhs6384S_g_n6214taB';
const sb=window.supabase.createClient(URL,KEY,{auth:{storageKey:'onehome-creator-projects-admin-v1',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);let user=null,rows=[];
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function say(text,good,id){const box=$(id||'notice');box.textContent=text;box.className='notice'+(good?' good':'')}
function hide(id){$(id||'notice').classList.add('hidden')}
function date(value){const item=new Date(value||0);return Number.isNaN(item.getTime())?'Unknown':item.toLocaleString()}
function owner(row){return String(row.project_data&&row.project_data.ownerLabel||row.owner_id||'Unknown Home ID')}
function findAssets(value,out){out=out||[];if(out.length>=12)return out;if(Array.isArray(value)){value.forEach(function(item){findAssets(item,out)});return out}if(value&&typeof value==='object'){if(value.__onehome_asset&&value.path){out.push(value);return out}Object.keys(value).forEach(function(key){findAssets(value[key],out)})}return out}
async function verify(){const email=String(user&&user.email||'').toLowerCase();const result=await sb.from('dood_admin_users').select('email').eq('role','admin').ilike('email',email).limit(1);if(result.error)throw result.error;if(!result.data||!result.data.length)throw new Error('This account is not approved as an admin.')}
async function openApp(){await verify();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await load()}
async function load(){hide();$('projects').innerHTML='<div class="card muted">Loading NFT Creator draft records…</div>';const result=await sb.from('creator_projects').select('*').order('updated_at',{ascending:false});if(result.error)throw result.error;rows=result.data||[];$('summary').textContent=rows.length+' saved project'+(rows.length===1?'':'s')+' across '+new Set(rows.map(function(row){return row.owner_id})).size+' Home ID'+(new Set(rows.map(function(row){return row.owner_id})).size===1?'':'s');$('projects').innerHTML=rows.length?rows.map(function(row,index){return '<article class="project"><div class="project-top"><div><h3>'+esc(row.name||'Untitled Collection')+'</h3><div class="meta"><span class="pill '+esc(row.status)+'">'+esc(row.status)+'</span><span class="pill">'+esc(row.creator_type)+'</span><span class="pill">Step '+esc(row.wizard_step)+'</span></div></div><button type="button" data-open="'+index+'">View Project</button></div><div id="detail-'+index+'" class="detail hidden"></div></article>'}).join(''):'<div class="card muted">No NFT Creator draft records have been saved yet.</div>';$('projects').querySelectorAll('[data-open]').forEach(function(button){button.onclick=function(){toggle(Number(button.dataset.open),button).catch(function(error){say(error.message||String(error))})}})}
async function toggle(index,button){const row=rows[index],box=$('detail-'+index);if(!box.classList.contains('hidden')){box.classList.add('hidden');button.textContent='View Project';return}button.disabled=true;const assets=findAssets(row.project_data||{}),images=[];for(const asset of assets){const signed=await sb.storage.from('creator-drafts').createSignedUrl(asset.path,300);if(!signed.error&&signed.data&&signed.data.signedUrl)images.push({url:signed.data.signedUrl,name:asset.name||asset.path.split('/').pop()})}box.innerHTML='<div class="detail-grid"><div class="detail-item"><strong>Creator Home ID</strong>'+esc(owner(row))+'<br><span class="muted">'+esc(row.owner_id)+'</span></div><div class="detail-item"><strong>Project ID</strong>'+esc(row.id)+'</div><div class="detail-item"><strong>Created</strong>'+esc(date(row.created_at))+'</div><div class="detail-item"><strong>Last saved</strong>'+esc(date(row.updated_at))+'</div></div>'+(images.length?'<div class="art">'+images.map(function(item){return '<figure><img src="'+esc(item.url)+'" alt="Saved project artwork"><figcaption>'+esc(item.name)+'</figcaption></figure>'}).join('')+'</div>':'<p class="muted">No saved artwork is attached to this project yet.</p>');box.classList.remove('hidden');button.textContent='Close Project';button.disabled=false}
$('signIn').onclick=async function(){hide('loginNotice');this.disabled=true;try{const result=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(result.error)throw result.error;user=result.data.user;await openApp()}catch(error){say(error.message||String(error),false,'loginNotice')}finally{this.disabled=false}};
$('refresh').onclick=function(){load().catch(function(error){say(error.message||String(error))})};$('logout').onclick=async function(){await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(async function(result){if(!result.data.session)return;user=result.data.session.user;try{await openApp()}catch(error){await sb.auth.signOut({scope:'local'}).catch(function(){});say(error.message||String(error),false,'loginNotice')}});
})();
</script>
