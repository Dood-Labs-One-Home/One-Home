<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community Open Mints · One Home Admin</title>
<script src="/shared/onehome-supabase-lite.js?v=1214"></script>
<style>
:root{color-scheme:dark;--red:#ef1825;--line:#49362b;--muted:#baa999;--cream:#fff1db;--green:#68dc6d}*{box-sizing:border-box}body{margin:0;background:#080706;color:var(--cream);font-family:Inter,system-ui,sans-serif}button,a.btn{border:1px solid #5d4434;background:#171310;color:var(--cream);border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}button.primary{background:var(--red);border-color:var(--red)}button:disabled{opacity:.5}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:22px 0 60px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{margin-right:auto}.card{border:1px solid var(--line);background:#14110e;border-radius:16px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #544437;background:#090807;color:var(--cream);border-radius:9px;padding:10px 12px;font:inherit}textarea{min-height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:var(--muted)}.notice{display:none;padding:12px;border:1px solid #8a373d;background:#321217;border-radius:10px;margin-top:12px}.notice.show{display:block}.notice.good{border-color:#317d45;background:#0e2b17}.row{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.row img{width:110px;height:72px;object-fit:cover;border-radius:10px}.row h3{margin:0 0 5px}.status{font-size:11px;text-transform:uppercase;color:var(--green)}.login{width:min(460px,calc(100% - 28px));margin:80px auto}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{grid-template-columns:80px 1fr}.row img{width:80px;height:58px}.row .actions{grid-column:1/-1}}
</style></head><body>
<section id="login" class="login card"><h1>Admin Sign In</h1><p class="muted">Only approved One Home admins can manage community mints.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label style="margin-top:10px">Password</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button id="signIn" class="primary">Sign In</button></div><div id="loginNotice" class="notice"></div></section>
<main id="app" class="wrap hidden"><div class="top"><h1>Community Open Mints</h1><a class="btn" href="/admin.html">Back to Admin</a><a class="btn" href="/open-mints.html" target="_blank" rel="noopener">View Public Page</a><button id="logout">Log Out</button></div><p class="muted">Projects remain private until an approved Admin reviews, approves, and publishes them.</p><div id="notice" class="notice"></div>
<section class="card"><h2 id="formTitle">Add Community Mint</h2><div class="grid">
<div><label>Project name</label><input id="projectName"></div><div><label>Chain</label><select id="chain"><option value="xrpl">XRP Ledger</option></select></div>
<div><label>Creator acknowledgement</label><input id="creator" placeholder="Hamsa"></div><div><label>Owner Passport</label><select id="passport"><option value="">Choose Passport</option></select></div>
<div class="full"><label>Mint website</label><input id="mintUrl" type="url" placeholder="https://"></div><div><label>Network</label><select id="network"><option value="mainnet">Mainnet</option><option value="testnet">Testnet</option></select></div><div><label>Banner image URL</label><input id="bannerUrl"></div>
<div class="full"><label>Upload banner</label><input id="bannerFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="full"><label>Public description (optional)</label><textarea id="description"></textarea></div><div class="full"><label>Rare's private research/review notes</label><textarea id="reviewNotes"></textarea></div>
</div><div class="actions"><button id="save" class="primary">Save Draft</button><button id="clear">Clear</button></div></section>
<section class="card"><h2>Saved Projects</h2><div id="list" class="muted">Loading…</div></section></main>
<script>
(()=>{'use strict';
const URL='https://fshvettlltcujmwvikfq.supabase.co',KEY='sb_publishable_ARrX-vYhy8l-yhs6384S_g_n6214taB';
const sb=window.supabase.createClient(URL,KEY,{auth:{storageKey:'onehome-admin-auth-v2',persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);
let user=null,mints=[],passports=[],editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function say(message,good=false,login=false){const el=$(login?'loginNotice':'notice');el.textContent=message;el.className='notice show'+(good?' good':'');}
async function api(action,payload={}){const session=(await sb.auth.getSession()).data.session;if(!session?.access_token)throw new Error('Admin sign-in required.');const response=await fetch(URL+'/functions/v1/onehome-open-mints',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});const data=await response.json().catch(()=>({}));if(!response.ok||data.success===false)throw new Error(data.error||'Open Mints request failed.');return data;}
async function start(){try{const data=await api('admin_list');mints=data.mints||[];passports=data.passports||[];$('passport').innerHTML='<option value="">Choose Passport</option>'+passports.map(p=>`<option value="${esc(p.id)}">${esc(p.display_name||p.username)} · @${esc(p.username)}</option>`).join('');render();$('login').classList.add('hidden');$('app').classList.remove('hidden');}catch(error){say(error.message,false,true);}}
function render(){$('list').innerHTML=mints.length?mints.map(m=>`<article class="row"><img src="${esc(m.banner_url)}" alt=""><div><h3>${esc(m.project_name)}</h3><div class="status">${esc(m.status.replaceAll('_',' '))}</div><div class="muted">Creator: ${esc(m.creator_acknowledgement)} · XRP Ledger ${m.network==='testnet'?'Testnet':'Mainnet'}</div><div class="muted">${esc(m.mint_url)}</div></div><div class="actions"><button data-edit="${m.id}">Edit</button>${buttons(m)}</div></article>`).join(''):'No community mint projects have been added.';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status));}
function buttons(m){const b=[];if(['draft','rejected'].includes(m.status))b.push(['under_review','Send to Review']);if(m.status==='under_review')b.push(['approved','Approve'],['rejected','Reject']);if(['approved','paused'].includes(m.status))b.push(['published','Publish']);if(m.status==='published')b.push(['paused','Pause'],['ended','End']);return b.map(x=>`<button data-id="${m.id}" data-status="${x[0]}">${x[1]}</button>`).join('');}
function edit(id){editing=mints.find(m=>m.id===id)||null;if(!editing)return;$('formTitle').textContent='Edit Community Mint';$('projectName').value=editing.project_name;$('creator').value=editing.creator_acknowledgement;$('passport').value=editing.owner_passport_id;$('mintUrl').value=editing.mint_url;$('network').value=editing.network;$('bannerUrl').value=editing.banner_url;$('description').value=editing.description||'';$('reviewNotes').value=editing.review_notes||'';scrollTo({top:0,behavior:'smooth'});}
function clear(){editing=null;$('formTitle').textContent='Add Community Mint';['projectName','creator','mintUrl','bannerUrl','description','reviewNotes'].forEach(id=>$(id).value='');$('passport').value='';$('network').value='mainnet';$('bannerFile').value='';}
async function upload(){const file=$('bannerFile').files?.[0];if(!file)return $('bannerUrl').value.trim();if(!/^image\/(png|jpeg|webp)$/i.test(file.type)||file.size>10*1024*1024)throw new Error('Choose a PNG, JPG, or WEBP banner up to 10 MB.');const ext=(file.name.split('.').pop()||'png').replace(/[^a-z0-9]/gi,'');const path=`community-open-mints/${Date.now()}-banner.${ext}`;const result=await sb.storage.from('doodlabs-media').upload(path,file,{contentType:file.type,upsert:false});if(result.error)throw result.error;return sb.storage.from('doodlabs-media').getPublicUrl(path).data.publicUrl;}
async function save(){try{$('save').disabled=true;const banner_url=await upload();await api('save',{id:editing?.id,project_name:$('projectName').value,creator_acknowledgement:$('creator').value,owner_passport_id:$('passport').value,mint_url:$('mintUrl').value,network:$('network').value,banner_url,description:$('description').value,review_notes:$('reviewNotes').value});say('Community mint saved.',true);clear();await start();}catch(error){say(error.message);}finally{$('save').disabled=false;}}
async function setStatus(id,status){if(status==='published'&&!confirm('Publish this approved project to the public Open Mints page?'))return;try{await api('set_status',{id,status});say('Project status updated.',true);await start();}catch(error){say(error.message);}}
$('signIn').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return say(r.error.message,false,true);user=r.data.user;await start();};$('password').onkeydown=e=>{if(e.key==='Enter')$('signIn').click();};$('save').onclick=save;$('clear').onclick=clear;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};sb.auth.getSession().then(r=>{if(r.data.session){user=r.data.session.user;start();}});
})();
</script></body></html>
