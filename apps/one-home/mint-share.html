<script>
/* One Home v14.67.62 — dedicated lightweight social-preview page.
   This page intentionally does NOT load Passport auth, wallet SDKs, mint runtime,
   or campaign APIs before its social metadata is ready. */
window.prerenderReady=false;
(function(){
  'use strict';
  function t(v){return String(v==null?'':v).trim();}
  function validId(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(t(v));}
  function set(id,value){var n=document.getElementById(id);if(n)n.setAttribute('content',value);}
  try{
    var p=new URLSearchParams(location.search||'');
    var id=t(p.get('campaign'));
    var version='146762';
    if(!validId(id)){window.prerenderReady=true;return;}
    var name=t(p.get('name'))||'One Home Mint';
    var title=name+' | One Home';
    var description='Mint '+name+' on One Home.';
    var image='https://fshvettlltcujmwvikfq.supabase.co/functions/v1/onehome-mint-page/card/'+encodeURIComponent(id)+'/'+version+'.png';
    var canonical=location.origin+location.pathname+location.search;
    var destination=t(p.get('to'));
    if(!destination||destination.charAt(0)!=='/')destination='/mint/'+encodeURIComponent(id)+'?source=x';
    try{
      var dest=new URL(destination,location.origin);
      if(dest.origin!==location.origin)throw new Error('external');
      dest.pathname='/mint/'+encodeURIComponent(id);
      dest.searchParams.set('source','x');
      destination=dest.pathname+(dest.search||'');
    }catch(_e){destination='/mint/'+encodeURIComponent(id)+'?source=x';}

    document.title=title;
    set('ohShareDescription',description);
    set('ohShareOgTitle',title);
    set('ohShareOgDescription',description);
    set('ohShareOgUrl',canonical);
    set('ohShareOgImage',image);
    set('ohShareOgImageSecure',image);
    set('ohShareOgImageAlt',name+' mint artwork');
    set('ohShareTwitterTitle',title);
    set('ohShareTwitterDescription',description);
    set('ohShareTwitterImage',image);
    set('ohShareTwitterImageAlt',name+' mint artwork');
    var canonicalLink=document.getElementById('ohShareCanonical');if(canonicalLink)canonicalLink.href=canonical;
    window.ONE_HOME_MINT_SHARE={campaignId:id,name:name,image:image,destination:destination};
    document.documentElement.dataset.onehomeMintShareReady='1';
    document.documentElement.dataset.onehomeMintShareVersion=version;
  }catch(_error){}
  window.prerenderReady=true;
})();
</script>

<script>
(function(){
  var state=window.ONE_HOME_MINT_SHARE||{};
  var name=document.getElementById('ohShareName');
