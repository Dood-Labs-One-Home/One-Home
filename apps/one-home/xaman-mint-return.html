<!doctype html>
<html lang="en">
<head>
  <script src="/shared/onehome-global-appearance-v1467200.js?v=1467200"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Returning to One Home…</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#050505;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(560px,100%);border:1px solid rgba(255,38,48,.7);border-radius:22px;background:#0c0c0c;padding:28px;text-align:center;box-shadow:0 0 40px rgba(255,38,48,.12)}
    h1{margin:0 0 12px;font-size:clamp(28px,7vw,44px);line-height:1}
    p{margin:0 0 18px;color:#d8d8d8;line-height:1.55}
    a{display:inline-flex;justify-content:center;align-items:center;min-height:52px;padding:12px 20px;border:1px solid #ff2630;border-radius:14px;color:#fff;background:#d80f19;text-decoration:none;font-weight:900}
  </style>
  <link rel="stylesheet" href="/shared/onehome-global-appearance-v1467142.css?v=1467141">
</head>
<body>
<main>
  <h1 id="title">Returning to One Home…</h1>
  <p id="message">Your Xaman approval is being handed back to the exact mint.</p>
  <a id="fallback" href="/one-home/" hidden>Return to One Home</a>
</main>
<script>
(function(){
  'use strict';

  const SIGNAL_KEY='onehome_xaman_mint_return_v146774';
  const MESSAGE_TYPE='onehome-xaman-mint-return';
  const ACK_TYPE='onehome-xaman-mint-return-ack';
  const CHANNEL_NAME='onehome-xaman-mint-return-v146777';
  const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  const params=new URLSearchParams(location.search);
  const payload=String(params.get('xaman_mint_payload')||'').trim();
  const campaign=String(params.get('campaign')||'').trim();
  const network=String(params.get('network')||'').trim().toLowerCase()==='mainnet'?'mainnet':'testnet';
  const founder=params.get('founder')==='1';
  const mode=String(params.get('mode')||'').trim().toLowerCase()==='desktop'?'desktop':'mobile';

  const title=document.getElementById('title');
  const message=document.getElementById('message');
  const fallback=document.getElementById('fallback');

  if(!UUID.test(payload) || (!founder && !UUID.test(campaign))){
    title.textContent='Return could not be matched';
    message.textContent='This Xaman return is missing the exact One Home mint reference. Return to the mint page and use its saved request.';
    fallback.hidden=false;
    return;
  }

  const canonical=founder
    ? '/?passport=mint&xaman_mint_payload='+encodeURIComponent(payload)
    : '/mint/'+encodeURIComponent(campaign)+'?network='+encodeURIComponent(network)+'&xaman_mint_payload='+encodeURIComponent(payload);

  fallback.href=canonical;

  const signal={
    type:MESSAGE_TYPE,
    payload_uuid:payload,
    campaign_id:campaign,
    network:network,
    founder:founder,
    saved_at:Date.now()
  };

  let acknowledged=false;
  let channel=null;
  let fallbackTimer=null;

  function saveStorageFallback(){
    try{
      localStorage.setItem(SIGNAL_KEY,JSON.stringify(signal));
      return true;
    }catch(_error){return false;}
  }

  function postToOriginal(){
    let posted=false;
    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage(signal,location.origin);
        posted=true;
        setTimeout(function(){try{window.blur();window.opener.focus();}catch(_error){}},0);
        setTimeout(function(){try{window.blur();window.opener.focus();}catch(_error){}},180);
      }
    }catch(_error){}
    return posted;
  }

  function broadcast(){
    try{
      channel=channel||new BroadcastChannel(CHANNEL_NAME);
      channel.postMessage(signal);
      return true;
    }catch(_error){return false;}
  }

  function showManualFallback(){
    if(acknowledged)return;
    title.textContent='Returning to One Home…';
    message.textContent='One Home has your Xaman approval. If the original mint tab did not come back into view, use the button below.';
    fallback.textContent='Return to One Home manually';
    fallback.hidden=false;
  }

  function acknowledge(){
    if(acknowledged)return;
    acknowledged=true;
    if(fallbackTimer)clearTimeout(fallbackTimer);
    fallback.hidden=true;
    title.textContent='Continuing mint…';
    message.textContent='The approval was handed back to your original One Home tab. This signing window is being kept ready for the next Xaman approval.';
    try{if(window.opener && !window.opener.closed){window.blur();window.opener.focus();}}catch(_error){}
    // If the browser refuses to return focus, do not strand the collector on a
    // dead-end bridge. Reveal the manual path only when this bridge still has
    // focus after the handoff has had time to settle.
    setTimeout(function(){
      try{
        if(document.hasFocus()){
          fallback.textContent='Return to One Home manually';
          fallback.hidden=false;
        }
      }catch(_error){}
    },1500);
  }

  window.addEventListener('message',function(event){
    if(event.origin!==location.origin)return;
    const data=event.data&&typeof event.data==='object'?event.data:null;
    if(!data||data.type!==ACK_TYPE||String(data.payload_uuid||'')!==payload)return;
    acknowledge();
  });

  if(mode==='desktop'){
    // Desktop keeps the same named, script-opened signing window alive so Xaman
    // approval 2+ cannot be blocked as a new popup. The bridge itself is not a
    // destination page: it immediately signals and returns focus to the original
    // One Home mint tab. Storage/BroadcastChannel are fallback transports only.
    title.textContent='Returning to One Home…';
    message.textContent='Preparing the next step in your mint.';
    fallback.hidden=true;
    saveStorageFallback();
    broadcast();
    postToOriginal();
    fallbackTimer=setTimeout(showManualFallback,2500);
    return;
  }

  // Mobile returns stay server-authoritative and do not depend on local browser
  // storage surviving Safari/Chrome <-> Xaman app switches.
  location.replace(canonical);
})();
</script>
</body>
</html>
