:root{--bg:#090807;--panel:#15110e;--line:#4a392e;--cream:#fff1db;--muted:#bba999;--red:#ef1825;--pink:#ff36d6;--green:#68dc6d}*{box-sizing:border-box}body{margin:0;background:#080706;color:var(--cream);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button,.btn{border:1px solid #634737;background:#181310;color:var(--cream);border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:var(--red);border-color:var(--red)}.danger{color:#ffc8cc;border-color:#a44148}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #554438;border-radius:9px;background:#090807;color:var(--cream)}textarea{min-height:90px}.top{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:12px 18px;background:#090807;border-bottom:1px solid #392b23}.top img{width:55px}.top .spacer{flex:1}.shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 80px)}aside{border-right:1px solid #392b23;padding:16px;overflow:auto}.main{padding:20px;overflow:auto}.card{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:16px;margin-bottom:14px}.page-row{width:100%;text-align:left;margin:4px 0}.active{border-color:var(--pink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted{color:var(--muted)}.hidden{display:none!important}.block-row{border:1px solid #403027;border-radius:12px;padding:12px;margin:9px 0}.small{font-size:12px}.notice{padding:12px;border:1px solid #5a3d2e;border-radius:10px;margin-bottom:12px}.good{border-color:#347b46;color:#d7ffdf}@media(max-width:800px){.shell{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}

</head><body><header class="top"><img src="/assets/one-home-logo.png"><strong>Pages & Rooms Builder</strong><span class="spacer"></span><a class="btn" href="/admin.html">Main Admin</a><a class="btn" href="/" target="_blank">Open Site</a><button id="logout" class="hidden">Log Out</button></header><section id="login" class="main"><div class="card" style="max-width:460px;margin:50px auto"><h1>Admin Sign In</h1><p class="muted">Use your approved One Home admin account.</p><div class="grid"><div class="full"><label>Email</label><input id="email" type="email"></div><div class="full"><label>Password</label><input id="password" type="password"></div><button id="signin" class="primary full">Sign In</button></div><div id="loginMsg" class="notice hidden"></div></div></section><main id="app" class="shell hidden"><aside><button id="newPage" class="primary" style="width:100%">+ Create New Page / Room</button><h3>Pages & Rooms</h3><div id="pages"></div></aside><section class="main"><div id="msg" class="notice hidden"></div><div id="editor"><div class="card"><h2>Select a page or create a new one.</h2><p class="muted">New pages automatically remain available in this builder. No Netlify upload is needed for content changes.</p></div></div></section></main><script>
(()=>{'use strict';const SB=window.supabase.createClient('https://fshvettlltcujmwvikfq.supabase.co','sb_publishable_ARrX-vYhy8l-yhs6384S_g_n6214taB',{auth:{storageKey:'onehome-admin-auth-v2'}});const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let user=null,pages=[],selected=null,blocks=[];function say(t,g=false){const e=$('msg');e.textContent=t;e.className='notice'+(g?' good':'');setTimeout(()=>e.classList.add('hidden'),5000)}async function admin(){const e=(user?.email||'').toLowerCase();const q=await SB.from('dood_admin_users').select('email').eq('role','admin').ilike('email',e).limit(1);return !q.error&&q.data?.length}async function sign(){const r=await SB.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;$('loginMsg').classList.remove('hidden');return}user=r.data.user;if(!await admin()){await SB.auth.signOut();$('loginMsg').textContent='This account is not approved as an admin.';$('loginMsg').classList.remove('hidden');return}start()}async function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await loadPages()}async function loadPages(){const r=await SB.from('onehome_pages').select('*').order('sort_order',{ascending:true});if(r.error){say('Run one_home_pages_rooms_builder.sql in Supabase first. '+r.error.message);return}pages=r.data||[];$('pages').innerHTML=pages.map(p=>`<button class="page-row ${selected?.id===p.id?'active':''}" data-id="${p.id}"><b>${esc(p.title)}</b><br><span class="small muted">/${esc(p.slug)} · ${esc(p.status)}</span></button>`).join('');document.querySelectorAll('.page-row').forEach(b=>b.onclick=()=>openPage(b.dataset.id))}async function openPage(id){selected=pages.find(p=>p.id===id);const r=await SB.from('onehome_page_blocks').select('*').eq('page_id',id).order('sort_order',{ascending:true});blocks=r.data||[];render();loadPages()}function pageForm(p={}){return `<div class="card"><h2>${p.id?'Page Settings':'Create Page / Room'}</h2><div class="grid"><div><label>Page title</label><input id="pTitle" value="${esc(p.title||'')}"></div><div><label>URL slug</label><input id="pSlug" value="${esc(p.slug||'')}"></div><div><label>Parent area</label><select id="pParent"><option value="rare-ink-studio">Rare Ink Studio</option><option value="explore">Explore</option><option value="lab">Lab / XRPL Home</option><option value="rollies-arcade">Rollies Arcade</option><option value="night-shots">Night Shots</option><option value="global">Global</option></select></div><div><label>Page type</label><select id="pType"><option>room</option><option>page</option><option>policy</option><option>form</option></select></div><div><label>Status</label><select id="pStatus"><option>draft</option><option>published</option><option>archived</option></select></div><div><label>Display order</label><input id="pOrder" type="number" value="${p.sort_order??100}"></div><div class="full"><label>Description</label><textarea id="pDesc">${esc(p.meta_description||'')}</textarea></div></div><div class="actions"><button id="savePage" class="primary">Save Page</button>${p.id?`<a class="btn" target="_blank" href="/room/${esc(p.slug)}">Preview Public Page</a><button id="deletePage" class="danger">Delete Page</button>`:''}</div></div>`}function render(){if(!selected){$('editor').innerHTML=pageForm();wirePage();return}$('editor').innerHTML=pageForm(selected)+`<div class="card"><div class="actions"><h2 style="margin-right:auto">Page Blocks</h2><button id="addBlock" class="primary">+ Add Block</button></div><p class="muted">Edit, hide, reorder, duplicate, or delete any block. Empty blocks leave no outline or spacing.</p><div id="blockList">${blocks.map(blockHtml).join('')||'<p class="muted">No blocks yet.</p>'}</div></div>`;wirePage();document.querySelectorAll('[data-edit-block]').forEach(b=>b.onclick=()=>editBlock(b.dataset.editBlock));$('addBlock').onclick=()=>editBlock(null)}function blockHtml(b){return `<div class="block-row"><b>${esc(b.label||b.block_type)}</b> <span class="small muted">${esc(b.block_type)} · order ${b.sort_order} · ${b.is_visible?'visible':'hidden'}</span><div class="actions"><button data-edit-block="${b.id}">Edit</button></div></div>`}function wirePage(){const p=selected||{};$('pParent').value=p.parent_area||'rare-ink-studio';$('pType').value=p.page_type||'room';$('pStatus').value=p.status||'draft';$('savePage').onclick=savePage;if($('deletePage'))$('deletePage').onclick=deletePage}async function savePage(){const v={title:$('pTitle').value.trim(),slug:$('pSlug').value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),parent_area:$('pParent').value,page_type:$('pType').value,status:$('pStatus').value,sort_order:Number($('pOrder').value||100),meta_description:$('pDesc').value.trim()};if(!v.title||!v.slug){say('Page title and URL slug are required.');return}let r;if(selected)r=await SB.from('onehome_pages').update(v).eq('id',selected.id).select().single();else r=await SB.from('onehome_pages').insert({...v,created_by:user.id}).select().single();if(r.error){say(r.error.message);return}selected=r.data;say('Page saved.',true);await loadPages();await openPage(selected.id)}async function deletePage(){if(!confirm('Permanently delete this page and all of its blocks?'))return;const r=await SB.from('onehome_pages').delete().eq('id',selected.id);if(r.error){say(r.error.message);return}selected=null;blocks=[];await loadPages();render();say('Page deleted.',true)}function editBlock(id){const b=blocks.find(x=>x.id===id)||{block_type:'paragraph',sort_order:(blocks.at(-1)?.sort_order||0)+10,is_visible:true,settings:{}};const s=b.settings||{};$('editor').innerHTML=pageForm(selected)+`<div class="card"><h2>${b.id?'Edit Block':'Add Block'}</h2><div class="grid"><div><label>Block type</label><select id="bType">${['heading','paragraph','button','image','card','notice','agreement','links','divider','spacer','section'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Admin label</label><input id="bLabel" value="${esc(b.label||'')}"></div><div class="full"><label>Text / content</label><textarea id="bContent">${esc(b.content||'')}</textarea></div><div><label>Link URL</label><input id="bUrl" value="${esc(b.link_url||'')}"></div><div><label>Button/link words</label><input id="bLinkText" value="${esc(b.link_text||'')}"></div><div><label>Image URL</label><input id="bImage" value="${esc(b.image_url||'')}"></div><div><label>Image description</label><input id="bAlt" value="${esc(b.alt_text||'')}"></div><div><label>Display order</label><input id="bOrder" type="number" value="${b.sort_order||100}"></div><div><label>Width</label><input id="bWidth" value="${esc(s.width||'')}"></div><div><label>Maximum width</label><input id="bMax" value="${esc(s.max_width||'')}"></div><div><label>Minimum height</label><input id="bMin" value="${esc(s.min_height||'')}"></div><div><label>Inside spacing</label><input id="bPadding" value="${esc(s.padding||'')}"></div><div><label>Background</label><input id="bBg" value="${esc(s.background||'')}"></div><div><label>Border color</label><input id="bBorder" value="${esc(s.border_color||'')}"></div><div><label>Text color</label><input id="bColor" value="${esc(s.text_color||'')}"></div><div><label>Corner roundness</label><input id="bRadius" value="${esc(s.radius||'')}"></div><div><label>Alignment</label><select id="bAlign"><option value="">Built-in</option><option>left</option><option>center</option><option>right</option></select></div><div><label>Heading level</label><select id="bLevel"><option>1</option><option>2</option><option>3</option></select></div><div class="full"><label><input id="bVisible" type="checkbox" style="width:auto" ${b.is_visible?'checked':''}> Show this block publicly</label></div></div><div class="actions"><button id="saveBlock" class="primary">Save Block</button><button id="backBlocks">Back to Blocks</button>${b.id?`<button id="duplicateBlock">Duplicate</button><button id="deleteBlock" class="danger">Delete Block</button>`:''}</div></div>`;wirePage();$('bType').value=b.block_type;$('bAlign').value=s.align||'';$('bLevel').value=String(s.level||2);$('saveBlock').onclick=()=>saveBlock(b);$('backBlocks').onclick=()=>openPage(selected.id);if(b.id){$('duplicateBlock').onclick=()=>duplicateBlock(b);$('deleteBlock').onclick=()=>deleteBlock(b)}}async function saveBlock(old){const settings={...old.settings,width:$('bWidth').value.trim(),max_width:$('bMax').value.trim(),min_height:$('bMin').value.trim(),padding:$('bPadding').value.trim(),background:$('bBg').value.trim(),border_color:$('bBorder').value.trim(),text_color:$('bColor').value.trim(),radius:$('bRadius').value.trim(),align:$('bAlign').value,level:Number($('bLevel').value)};Object.keys(settings).forEach(k=>{if(settings[k]===''||settings[k]==null)delete settings[k]});const v={page_id:selected.id,block_type:$('bType').value,label:$('bLabel').value.trim(),content:$('bContent').value,link_url:$('bUrl').value.trim(),link_text:$('bLinkText').value.trim(),image_url:$('bImage').value.trim(),alt_text:$('bAlt').value.trim(),sort_order:Number($('bOrder').value||100),is_visible:$('bVisible').checked,settings};const r=old.id?await SB.from('onehome_page_blocks').update(v).eq('id',old.id):await SB.from('onehome_page_blocks').insert(v);if(r.error){say(r.error.message);return}say('Block saved.',true);openPage(selected.id)}async function duplicateBlock(b){const v={...b};delete v.id;delete v.created_at;delete v.updated_at;v.sort_order=(b.sort_order||100)+1;const r=await SB.from('onehome_page_blocks').insert(v);if(r.error)say(r.error.message);else{say('Block duplicated.',true);openPage(selected.id)}}async function deleteBlock(b){if(!confirm('Delete this block?'))return;const r=await SB.from('onehome_page_blocks').delete().eq('id',b.id);if(r.error)say(r.error.message);else{say('Block deleted.',true);openPage(selected.id)}}$('signin').onclick=sign;$('logout').onclick=async()=>{await SB.auth.signOut();location.reload()};$('newPage').onclick=()=>{selected=null;blocks=[];render()};SB.auth.getSession().then(async r=>{if(r.data.session){user=r.data.session.user;if(await admin())start()}})})();
</script>
