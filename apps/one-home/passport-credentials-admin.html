<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Home · Passport Credentials & Benefits</title>
<link rel="icon" href="/favicon.png">
<script src="/shared/onehome-global-appearance-v1467200.js?v=1467200"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<style>
:root{--bg:#080706;--panel:#14110e;--line:#49362b;--cream:#fff1db;--muted:#baa999;--red:#ef1825;--gold:#d99a44;--green:#68dc6d;--pink:#ff36d6;--danger:#ff6770}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#29170c 0,#080706 42%,#030303 100%);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid #5d4434;background:#171310;color:var(--cream);border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}button:hover{border-color:var(--red)}button.primary{background:var(--red);border-color:var(--red);color:white}button.good{border-color:var(--green);color:#bdffc1}button.danger{border-color:var(--danger);color:#ffd0d3}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{width:100%;border:1px solid #544437;background:#090807;color:var(--cream);border-radius:9px;padding:10px 12px}textarea{min-height:80px;resize:vertical}label{display:block;color:#ead6c2;font-size:12px;font-weight:850;margin-bottom:6px}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:11px}.topbar{min-height:72px;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #3a2920;background:rgba(4,4,4,.94);position:sticky;top:0;z-index:20}.topbar img{width:60px;height:50px;object-fit:contain}.topbar h1{font-size:18px;margin:0}.topbar p{margin:2px 0 0;font-size:11px;color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.shell{width:min(1500px,100%);margin:auto;padding:20px}.login{width:min(460px,calc(100% - 30px));margin:80px auto;background:linear-gradient(145deg,#1a140f,#0c0b0a);border:1px solid var(--red);border-radius:20px;padding:26px}.login .stack{display:grid;gap:13px;margin-top:18px}.notice{display:none;white-space:pre-wrap;border:1px solid #8a373d;background:#321217;color:#ffd5d8;padding:11px;border-radius:10px;margin:12px 0}.notice.show{display:block}.notice.good{border-color:#317d45;background:#0e2b17;color:#d8ffe0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button.active{background:var(--red);border-color:var(--red)}.panel{border:1px solid var(--line);background:linear-gradient(145deg,#171310,#0c0b0a);border-radius:16px;padding:16px;margin-bottom:14px}.panel h2,.panel h3{margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid .full{grid-column:1/-1}.checks{display:flex;gap:16px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:7px;margin:0}.checks input{width:auto}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar .spacer{flex:1}.list{display:grid;gap:10px;margin-top:12px}.row{border:1px solid #3d3028;background:#100e0c;border-radius:13px;padding:13px}.row-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.row-head .copy{flex:1;min-width:210px}.row h3{margin:0 0 3px}.pill{display:inline-flex;border:1px solid #5c4739;border-radius:999px;padding:4px 8px;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.pill.active{border-color:var(--green);color:#a7ffad}.pill.historical{border-color:var(--gold);color:#ffd18d}.pill.inactive{border-color:#6d6260;color:#c5b9b7}.benefit{margin-top:8px;padding:9px;border:1px solid #342a24;border-radius:9px}.table-wrap{overflow:auto;border:1px solid #3b3028;border-radius:12px;margin-top:12px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 10px;border-bottom:1px solid #30251f;text-align:left;vertical-align:top}.table th{background:#0d0b0a;color:#e9cfb8;position:sticky;top:0}.empty{border:1px dashed #564336;border-radius:12px;padding:22px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.grid .full{grid-column:auto}.shell{padding:12px}.topbar{align-items:flex-start}.top-actions{margin-left:0}}
</style>
</head>
<body>
<header class="topbar"><img src="/assets/one-home-logo.png" alt="One Home"><div><h1>Passport Credentials & Benefits</h1><p>Verified ownership, historical status, benefits and fulfillment.</p></div><div class="top-actions"><button id="backAdmin">← One Home Admin</button><span class="small muted" id="userEmail"></span><button id="logout" class="hidden">Log Out</button></div></header>
<section id="loginView" class="login"><h2>One Home Platform Admin</h2><p class="muted">Use your One Home Passport admin account.</p><form id="loginForm" class="stack"><div><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">Sign In</button></form><div id="loginNotice" class="notice"></div></section>
<main id="app" class="shell hidden"><div id="notice" class="notice"></div><nav class="tabs"><button class="active" data-tab="holders">Passport Holders</button><button data-tab="items">Qualifying Items</button><button data-tab="benefits">Benefits</button></nav><section id="content"></section></main>
<script>
(()=>{'use strict';
const SUPABASE_URL=window.DOOD_SUPABASE_URL||'https://fshvettlltcujmwvikfq.supabase.co',SUPABASE_KEY=window.DOOD_SUPABASE_KEY||'sb_publishable_ARrX-vYhy8l-yhs6384S_g_n6214taB',ENDPOINT=SUPABASE_URL.replace(/\/$/,'')+'/functions/v1/passport-credential-manager';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);let session=null,data={items:[],benefits:[],profiles:[],states:[],benefit_records:[],checks:[]},tab='holders',busy=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmt=v=>{if(!v)return'—';try{return new Date(v).toLocaleString()}catch(_e){return String(v)}};
function note(msg,good=false,id='notice'){const el=$(id);el.textContent=msg;el.className='notice show'+(good?' good':'')}
async function call(payload){const current=session|| (await sb.auth.getSession()).data.session;if(!current?.access_token)throw new Error('Sign in again.');const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+current.access_token},body:JSON.stringify(payload)});const raw=await r.text();let j={};try{j=raw?JSON.parse(raw):{}}catch(_e){j={error:raw}}if(!r.ok||j.success===false)throw new Error(j.error||'Credential request failed.');return j}
async function load(){if(busy)return;busy=true;try{const j=await call({action:'dashboard'});data=j;render()}catch(e){note(e.message||String(e))}finally{busy=false}}
function itemBy(id){return data.items.find(x=>x.id===id)||{}}function benefitBy(id){return data.benefits.find(x=>x.id===id)||{}}function statesFor(uid){return data.states.filter(x=>x.owner_user_id===uid)}function recordsFor(uid){return data.benefit_records.filter(x=>x.owner_user_id===uid)}function checkFor(uid){return data.checks.find(x=>x.owner_user_id===uid)||{}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='items')renderItems();else if(tab==='benefits')renderBenefits();else renderHolders()}
function renderHolders(){const c=$('content');const rows=(data.profiles||[]).map(p=>{const states=statesFor(p.user_id),records=recordsFor(p.user_id),check=checkFor(p.user_id);const creds=states.length?states.map(s=>{const i=itemBy(s.credential_item_id);return `<span class="pill ${esc(s.status)}">${esc(i.public_label||i.display_name||'Credential')} · ${esc(s.status)}</span>`}).join(' '):'<span class="muted">No verified credentials</span>';const benefits=records.length?records.map(r=>{const b=benefitBy(r.benefit_id);return `<div class="benefit"><b>${esc(b.name||'Benefit')}</b> · <span class="pill ${r.status==='available'?'active':r.status==='delivered'?'active':'inactive'}">${esc(r.status)}</span><div class="small muted">Eligible ${fmt(r.eligible_at)}${r.delivered_at?' · Delivered '+fmt(r.delivered_at):''}</div>${r.status==='available'?`<button class="good" data-deliver="${esc(r.id)}" style="margin-top:7px">Mark Received / Delivered</button>`:''}</div>`}).join(''):'';return `<tr><td><b>${esc(p.display_name||p.username||'Passport')}</b><br><span class="muted">@${esc(p.username||'')}<br>${esc(p.user_id)}</span></td><td>${creds}</td><td>${benefits||'<span class="muted">No benefit records</span>'}</td><td>${fmt(check.checked_at)}</td><td><button data-sync="${esc(p.user_id)}">Recheck</button></td></tr>`}).join('');c.innerHTML=`<div class="panel"><div class="toolbar"><div><h2>Current Passport Holders</h2><p class="muted small">Recheck reads verified linked XRPL wallets and updates Active/Historical status. No wallet is made public.</p></div><span class="spacer"></span><button id="recheckAll" class="primary">Recheck All Passports</button><button id="exportCsv">Export Current List</button><button id="reload">Reload</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Passport</th><th>Credentials</th><th>Benefits</th><th>Last Checked</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5">No Passport profiles found.</td></tr>'}</tbody></table></div></div>`;$('reload').onclick=load;$('recheckAll').onclick=recheckAll;$('exportCsv').onclick=exportCurrentList;c.querySelectorAll('[data-sync]').forEach(b=>b.onclick=()=>syncOne(b.dataset.sync,b));c.querySelectorAll('[data-deliver]').forEach(b=>b.onclick=()=>markDelivered(b.dataset.deliver,b))}
async function syncOne(uid,btn){btn.disabled=true;btn.textContent='Checking…';try{await call({action:'sync_user',user_id:uid});note('Passport ownership rechecked.',true);await load()}catch(e){note(e.message||String(e))}finally{btn.disabled=false;btn.textContent='Recheck'}}
function exportCurrentList(){const items=(data.items||[]).filter(i=>i.is_active);const headers=['Passport','Username','Passport UUID',...items.map(i=>i.public_label||i.display_name),'Last Checked'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const lines=[headers.map(q).join(',')];for(const p of data.profiles||[]){const states=statesFor(p.user_id);const byItem=new Map(states.map(s=>[s.credential_item_id,s.status]));lines.push([p.display_name||p.username||'Passport',p.username||'',p.user_id,...items.map(i=>byItem.get(i.id)||''),checkFor(p.user_id).checked_at||''].map(q).join(','))}const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='one-home-passport-credentials-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);note('Current Passport credential list exported.',true)}
async function recheckAll(){const btn=$('recheckAll');btn.disabled=true;let done=0;try{for(const p of data.profiles||[]){btn.textContent=`Checking ${done+1}/${data.profiles.length}…`;await call({action:'sync_user',user_id:p.user_id});done++}note(`Rechecked ${done} Passport${done===1?'':'s'}.`,true);await load()}catch(e){note(`Stopped after ${done}: ${e.message||e}`)}finally{btn.disabled=false;btn.textContent='Recheck All Passports'}}
async function markDelivered(id,btn){const notes=prompt('Optional delivery/receipt note:','')||'';btn.disabled=true;try{await call({action:'mark_benefit',record_id:id,status:'delivered',notes});note('Benefit marked received/delivered.',true);await load()}catch(e){note(e.message||String(e))}finally{btn.disabled=false}}
function renderItems(){const c=$('content'),options=['issuer_taxon','exact_nft','campaign_inventory'];const list=(data.items||[]).map(i=>`<div class="row"><div class="row-head"><div class="copy"><h3>${esc(i.display_name)}</h3><div class="muted small">${esc(i.slug)} · ${esc(i.chain)} ${esc(i.network)} · ${esc(i.match_type)}</div><div class="small">Passport label: <b>${esc(i.public_label)}</b></div>${i.match_type==='issuer_taxon'?`<div class="muted small">${esc(i.issuer_address||'')} · Taxon ${esc(i.nftoken_taxon??'Any')}</div>`:i.match_type==='exact_nft'?`<div class="muted small">NFTokenID ${esc(i.nftoken_id||'')}</div>`:`<div class="muted small">Campaign ${esc(i.campaign_slug||'')}</div>`}</div><span class="pill ${i.is_active?'active':'inactive'}">${i.is_active?'Active':'Inactive'}</span><button data-edit-item="${esc(i.id)}">Edit</button><button class="${i.is_active?'danger':'good'}" data-toggle-item="${esc(i.id)}" data-active="${i.is_active?'1':'0'}">${i.is_active?'Remove / Deactivate':'Reactivate'}</button></div></div>`).join('');c.innerHTML=`<div class="panel"><h2>Add / Edit Qualifying Item</h2><p class="muted small">Only established items are displayed on Passports. Adding an item here creates no placeholder for non-holders.</p><input id="itemId" type="hidden"><div class="grid"><div><label>Name</label><input id="itemName" placeholder="Founder"></div><div><label>Passport Label</label><input id="itemLabel" placeholder="Founder"></div><div><label>Slug</label><input id="itemSlug" placeholder="founder"></div><div><label>Match Type</label><select id="itemMatch">${options.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div><div><label>Network</label><select id="itemNetwork"><option value="mainnet">XRPL Mainnet</option><option value="testnet">XRPL Testnet</option></select></div><div><label>Sort Order</label><input id="itemSort" type="number" value="100"></div><div><label>XRPL Issuer (issuer_taxon)</label><input id="itemIssuer"></div><div><label>NFTokenTaxon (issuer_taxon)</label><input id="itemTaxon" type="number"></div><div class="full"><label>Exact NFTokenID (exact_nft)</label><input id="itemNft"></div><div class="full"><label>Existing Mint Campaign Slug (campaign_inventory)</label><input id="itemCampaign"></div><div class="full"><label>Description</label><textarea id="itemDescription"></textarea></div><div class="full checks"><label><input id="itemShow" type="checkbox" checked> Show when verified</label><label><input id="itemHistory" type="checkbox" checked> Show Historical after transfer</label><label><input id="itemActive" type="checkbox" checked> Active</label></div></div><div class="toolbar" style="margin-top:12px"><button id="saveItem" class="primary">Save Qualifying Item</button><button id="clearItem">Clear</button></div></div><div class="panel"><h2>Configured Items</h2><div class="list">${list||'<div class="empty">No qualifying items configured.</div>'}</div></div>`;$('saveItem').onclick=saveItem;$('clearItem').onclick=()=>renderItems();c.querySelectorAll('[data-edit-item]').forEach(b=>b.onclick=()=>editItem(b.dataset.editItem));c.querySelectorAll('[data-toggle-item]').forEach(b=>b.onclick=()=>toggleItem(b.dataset.toggleItem,b.dataset.active!=='1',b))}
function editItem(id){const i=itemBy(id);$('itemId').value=i.id||'';$('itemName').value=i.display_name||'';$('itemLabel').value=i.public_label||'';$('itemSlug').value=i.slug||'';$('itemMatch').value=i.match_type||'issuer_taxon';$('itemNetwork').value=i.network||'mainnet';$('itemSort').value=i.sort_order??100;$('itemIssuer').value=i.issuer_address||'';$('itemTaxon').value=i.nftoken_taxon??'';$('itemNft').value=i.nftoken_id||'';$('itemCampaign').value=i.campaign_slug||'';$('itemDescription').value=i.description||'';$('itemShow').checked=i.show_on_passport!==false;$('itemHistory').checked=i.show_history_on_passport!==false;$('itemActive').checked=i.is_active!==false;scrollTo({top:0,behavior:'smooth'})}
async function saveItem(){const btn=$('saveItem'),item={id:$('itemId').value,display_name:$('itemName').value,public_label:$('itemLabel').value,slug:$('itemSlug').value,match_type:$('itemMatch').value,chain:'xrpl',network:$('itemNetwork').value,sort_order:Number($('itemSort').value||100),issuer_address:$('itemIssuer').value,nftoken_taxon:$('itemTaxon').value,nftoken_id:$('itemNft').value,campaign_slug:$('itemCampaign').value,description:$('itemDescription').value,show_on_passport:$('itemShow').checked,show_history_on_passport:$('itemHistory').checked,is_active:$('itemActive').checked};btn.disabled=true;try{await call({action:'save_item',item});note('Qualifying item saved.',true);await load()}catch(e){note(e.message||String(e))}finally{btn.disabled=false}}
async function toggleItem(id,active,btn){if(!active&&!confirm('Deactivate this qualifying item? History stays in Admin, but it stops appearing as an active Passport program.'))return;btn.disabled=true;try{await call({action:'set_item_active',item_id:id,is_active:active});note(active?'Item reactivated.':'Item deactivated; history preserved.',true);await load()}catch(e){note(e.message||String(e))}finally{btn.disabled=false}}
function renderBenefits(){const c=$('content'),itemOpts=(data.items||[]).filter(i=>i.is_active).map(i=>`<option value="${esc(i.id)}">${esc(i.display_name)}</option>`).join(''),list=(data.benefits||[]).map(b=>{const i=itemBy(b.credential_item_id);return `<div class="row"><div class="row-head"><div class="copy"><h3>${esc(b.name)}</h3><div class="muted small">${esc(i.display_name||'Credential')} · ${esc(b.eligibility_mode)} · Release ${fmt(b.available_from)}</div><div class="small">${esc(b.description||'')}</div></div><span class="pill ${b.is_active?'active':'inactive'}">${b.is_active?'Active':'Inactive'}</span><button data-edit-benefit="${esc(b.id)}">Edit</button><button class="${b.is_active?'danger':'good'}" data-toggle-benefit="${esc(b.id)}" data-active="${b.is_active?'1':'0'}">${b.is_active?'Remove / Deactivate':'Reactivate'}</button></div></div>`}).join('');c.innerHTML=`<div class="panel"><h2>Add / Edit Benefit</h2><p class="muted small"><b>Holder at release</b> is the default: whoever holds the NFT when the benefit is released receives that benefit; a later buyer receives future releases, not past ones.</p><input id="benefitId" type="hidden"><div class="grid"><div><label>Qualifying Item</label><select id="benefitItem">${itemOpts}</select></div><div><label>Name</label><input id="benefitName"></div><div><label>Slug</label><input id="benefitSlug"></div><div><label>Eligibility</label><select id="benefitMode"><option value="holder_at_release">Holder at release</option><option value="current_holder">Any current holder while active</option><option value="manual">Manual only</option></select></div><div><label>Available From</label><input id="benefitFrom" type="datetime-local"></div><div><label>Expires (optional)</label><input id="benefitExpires" type="datetime-local"></div><div class="full"><label>Description</label><textarea id="benefitDescription"></textarea></div><div class="full checks"><label><input id="benefitActive" type="checkbox" checked> Active</label></div></div><div class="toolbar" style="margin-top:12px"><button id="saveBenefit" class="primary">Save Benefit</button><button id="clearBenefit">Clear</button></div></div><div class="panel"><h2>Configured Benefits</h2><div class="list">${list||'<div class="empty">No benefits configured yet.</div>'}</div></div>`;const local=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);$('benefitFrom').value=local;$('saveBenefit').onclick=saveBenefit;$('clearBenefit').onclick=()=>renderBenefits();c.querySelectorAll('[data-edit-benefit]').forEach(b=>b.onclick=()=>editBenefit(b.dataset.editBenefit));c.querySelectorAll('[data-toggle-benefit]').forEach(b=>b.onclick=()=>toggleBenefit(b.dataset.toggleBenefit,b.dataset.active!=='1',b))}
function editBenefit(id){const b=benefitBy(id);$('benefitId').value=b.id||'';$('benefitItem').value=b.credential_item_id||'';$('benefitName').value=b.name||'';$('benefitSlug').value=b.slug||'';$('benefitMode').value=b.eligibility_mode||'holder_at_release';$('benefitDescription').value=b.description||'';$('benefitActive').checked=b.is_active!==false;const toLocal=v=>v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';$('benefitFrom').value=toLocal(b.available_from);$('benefitExpires').value=toLocal(b.expires_at);scrollTo({top:0,behavior:'smooth'})}
async function saveBenefit(){const btn=$('saveBenefit'),asIso=id=>$(id).value?new Date($(id).value).toISOString():null,benefit={id:$('benefitId').value,credential_item_id:$('benefitItem').value,name:$('benefitName').value,slug:$('benefitSlug').value,eligibility_mode:$('benefitMode').value,description:$('benefitDescription').value,available_from:asIso('benefitFrom'),expires_at:asIso('benefitExpires'),is_active:$('benefitActive').checked};btn.disabled=true;try{if(!benefit.id&&benefit.is_active&&benefit.eligibility_mode==='holder_at_release'&&(!benefit.available_from||new Date(benefit.available_from).getTime()<=Date.now())){note('Verifying current holders before releasing this benefit…');let checked=0;for(const p of data.profiles||[]){btn.textContent=`Verifying holders ${checked+1}/${data.profiles.length}…`;await call({action:'sync_user',user_id:p.user_id});checked++}btn.textContent='Saving Benefit…'}await call({action:'save_benefit',benefit});note('Benefit saved and current eligibility evaluated.',true);await load()}catch(e){note(e.message||String(e))}finally{btn.disabled=false;btn.textContent='Save Benefit'}}
async function toggleBenefit(id,active,btn){if(!active&&!confirm('Deactivate this benefit? Undelivered availability will be revoked; delivered history stays.'))return;btn.disabled=true;try{await call({action:'set_benefit_active',benefit_id:id,is_active:active});note(active?'Benefit reactivated.':'Benefit deactivated; delivered history preserved.',true);await load()}catch(e){note(e.message||String(e))}finally{btn.disabled=false}}
async function enter(s){session=s;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('userEmail').textContent=s.user?.email||'';await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();note('Signing in…',false,'loginNotice');try{await sb.auth.signOut({scope:'local'}).catch(()=>{});const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;if(!r.data.session)throw new Error('No valid session returned.');await enter(r.data.session);$('loginNotice').className='notice'}catch(e){note(e.message||String(e),false,'loginNotice')}};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('backAdmin').onclick=()=>location.href='/admin.html';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});sb.auth.getSession().then(({data:d})=>{if(d.session)enter(d.session).catch(e=>note(e.message||String(e),false,'loginNotice'))});
})();
</script>
</body>
</html>
