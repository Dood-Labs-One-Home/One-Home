<title>Opening Test Mint</title>

<body style="margin:0;background:#050708;color:#fff;font:600 16px/1.4 system-ui;display:grid;place-items:center;min-height:100vh">
<p>Opening test mint…</p>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const campaign=String(p.get('campaign')||'').trim();
  const network=String(p.get('network')||'testnet').toLowerCase();
  if(/^[0-9a-f-]{36}$/i.test(campaign) && network==='testnet'){
    p.set('campaign',campaign);
    p.set('network','testnet');
    location.replace('/test-mint.html?'+p.toString());
  }else{
    location.replace('/mint-studio.html');
  }
})();
</script>
</body>
</html>
